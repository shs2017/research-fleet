[project]
name = "research-fleet"
version = "0.1.0"
description = "Auditable, containerized, multi-GPU agent fleet for autonomous research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ray = ["ray[default]>=2.30"]
mcp = ["mcp>=1.2"]
sdk = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fleet = "research_fleet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
