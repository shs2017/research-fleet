<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="research-fleet">
  <title>research-fleet</title>

  <defs>
    <!-- The same flask as research-ship: one experiment vessel. A fleet runs many. -->
    <symbol id="flask" viewBox="0 0 34 36">
      <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 1 V11 L3 31 Q1 35 7 35 H27 Q33 35 31 31 L21 11 V1"/>
        <path d="M9 1 H25"/>
      </g>
      <!-- contents: the experiment in progress -->
      <path d="M5 26 H29 L31 31 Q33 35 27 35 H7 Q1 35 3 31 Z" fill="#8B5CF6" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- Mark: a scheduler fanning out to three vessels, over the measured result. -->
  <g transform="translate(46, 26)">

    <!-- scheduler -->
    <rect x="62" y="0" width="28" height="28" rx="8" fill="#8B5CF6"/>

    <!-- fan-out -->
    <g stroke="#64748B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"
       opacity="0.85" fill="none">
      <path d="M76 28 v12 H20 v10"/>
      <path d="M76 28 v22"/>
      <path d="M76 28 v12 H132 v10"/>
    </g>

    <!-- three experiments running in parallel -->
    <use href="#flask" x="3" y="50" width="34" height="36"/>
    <use href="#flask" x="59" y="50" width="34" height="36"/>
    <use href="#flask" x="115" y="50" width="34" height="36"/>

    <!-- the result: a loss curve, plus the axes it was measured against -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 98 V126 H148" stroke="#64748B" stroke-width="2.2" opacity="0.7"/>
      <path d="M13 101 C 40 103, 52 118, 76 121 S 118 125, 145 126"
            stroke="#06B6D4" stroke-width="2.8"/>
    </g>
  </g>

  <!-- Wordmark, aligned with research-ship so the two read as a set. -->
  <text x="234" y="94"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="47" font-weight="600" letter-spacing="-1">
    <tspan fill="#7D8CA1">research-</tspan><tspan fill="#8B5CF6">fleet</tspan>
  </text>

  <text x="236" y="128"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="17" fill="#7D8CA1" letter-spacing="0.4">
    Orchestrate budgeted agent workflows on your GPUs
  </text>
</svg>
