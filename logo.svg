<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="research-fleet">
  <title>research-fleet</title>

  <defs>
    <!-- The same chip glyph as gpu-sandbox: the fleet is made of those containers. -->
    <symbol id="chip" viewBox="-8 -8 60 60">
      <g fill="none" stroke="#06B6D4" stroke-width="2.6" stroke-linecap="round">
        <line x1="12" y1="-7" x2="12" y2="0"/>
        <line x1="22" y1="-7" x2="22" y2="0"/>
        <line x1="32" y1="-7" x2="32" y2="0"/>
        <line x1="12" y1="44" x2="12" y2="51"/>
        <line x1="22" y1="44" x2="22" y2="51"/>
        <line x1="32" y1="44" x2="32" y2="51"/>
        <line x1="-7" y1="12" x2="0" y2="12"/>
        <line x1="-7" y1="22" x2="0" y2="22"/>
        <line x1="-7" y1="32" x2="0" y2="32"/>
        <line x1="44" y1="12" x2="51" y2="12"/>
        <line x1="44" y1="22" x2="51" y2="22"/>
        <line x1="44" y1="32" x2="51" y2="32"/>
      </g>
      <rect x="0" y="0" width="44" height="44" rx="9" fill="none" stroke="#06B6D4" stroke-width="2.8"/>
      <rect x="14" y="14" width="16" height="16" rx="4" fill="#8B5CF6"/>
    </symbol>
  </defs>

  <!-- Mark: a scheduler fanning out to three sandboxed chips, over the audit ledger.
       Same chip and same dashed boundary as gpu-sandbox — one cell there, a fleet here. -->
  <g transform="translate(46, 26)">
    <!-- scheduler -->
    <rect x="62" y="0" width="28" height="28" rx="8" fill="#8B5CF6"/>

    <!-- fan-out -->
    <g stroke="#64748B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"
       opacity="0.85" fill="none">
      <path d="M76 28 v13 H17 v13"/>
      <path d="M76 28 v26"/>
      <path d="M76 28 v13 H135 v13"/>
    </g>

    <!-- three sandboxed workers -->
    <g>
      <rect x="0" y="54" width="34" height="34" rx="9" fill="none" stroke="#64748B"
            stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
      <use href="#chip" x="5" y="59" width="24" height="24"/>

      <rect x="59" y="54" width="34" height="34" rx="9" fill="none" stroke="#64748B"
            stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
      <use href="#chip" x="64" y="59" width="24" height="24"/>

      <rect x="118" y="54" width="34" height="34" rx="9" fill="none" stroke="#64748B"
            stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
      <use href="#chip" x="123" y="59" width="24" height="24"/>
    </g>

    <!-- the append-only ledger every job writes to -->
    <g stroke="#06B6D4" stroke-width="2.6" stroke-linecap="round" opacity="0.8">
      <line x1="11" y1="102" x2="141" y2="102"/>
      <line x1="11" y1="111" x2="115" y2="111"/>
      <line x1="11" y1="120" x2="130" y2="120"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="234" y="94"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="47" font-weight="600" letter-spacing="-1">
    <tspan fill="#7D8CA1">research-</tspan><tspan fill="#8B5CF6">fleet</tspan>
  </text>

  <text x="236" y="128"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="17" fill="#7D8CA1" letter-spacing="0.4">
    Auditable, budgeted agent swarms across your GPUs
  </text>
</svg>
