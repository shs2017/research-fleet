# Project overrides. Omitted values use safe built-in defaults.
root: ~/.research-fleet
workspace: .
isolate_agents: false

executor:
  kind: ship                 # ship | dry-run

agent:
  name: claude-cli           # claude-cli | codex-cli

budget:
  max_usd: 50
  max_tokens: 100000000
  default_model: claude-opus-5
  default_effort: high

policy:
  max_concurrent_jobs: 8
  max_agent_depth: 2
  max_children_per_agent: 8
