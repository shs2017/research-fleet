name: implement-and-review
description: a dependency graph with a review cycle
max_iterations: 4

graph:
  plan:
    task: Write PLAN.md.

  implement:
    task: "Follow PLAN.md. {{ steps.review.output }} Address any feedback above."
    needs: [plan, review]

  review:
    task: Review the tree. Reply APPROVED if ready, else list what must change.
    needs: [implement]
    until:
      output_contains: APPROVED

  verify:
    kind: command
    command: [pytest, -q]
    needs: [review]

  document:
    task: Update the README.
    needs: [review]
